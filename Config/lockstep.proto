syntax = "proto3";
package lockstep;
option csharp_namespace = "Lockstep.Proto";

message C2S_Ping {
  uint32 client_send_ms = 1;
}

message S2C_Pong {
  uint32 client_send_ms = 1;
}

message C2S_Join {
  uint32 protocol_version = 1;
}

message S2C_JoinAck {
  uint32 player_id = 1;
}

message S2C_JoinReject {
  uint32 reason = 1;
}

message S2C_MatchStart {
  uint32 tick_hz = 1;
  uint32 input_delay_frames = 2;
  uint32 seed = 3;
  int32 arena_half_extent_mm = 4;
}
