syntax = "proto3";
package lockstep;
option csharp_namespace = "Lockstep.Proto";

enum MsgId {
  Unspecified = 0;
  C2S_Hello = 1;
  S2C_Hello = 2;
  C2S_Join = 3;
  S2C_JoinAck = 4;
  S2C_JoinReject = 5;
  S2C_RoomUpdate = 6;
  C2S_Start = 7;
  S2C_MatchStart = 8;
}

enum JoinRejectReason {
  JoinRejectUnspecified = 0;
  JoinRejectFull = 1;
  JoinRejectPlaying = 2;
  JoinRejectAlreadyInRoom = 3;
}

message Packet {
  MsgId id = 1;
  bytes body = 2;
}

message C2SHello {
  string text = 1;
}

message S2CHello {
  string text = 1;
}

message RoomPlayer {
  uint32 player_id = 1;
  bool is_host = 2;
}

message C2SJoin {
  uint32 room_id = 1;
}

message S2CJoinAck {
  uint32 room_id = 1;
  uint32 player_id = 2;
  bool is_host = 3;
  repeated RoomPlayer players = 4;
}

message S2CJoinReject {
  JoinRejectReason reason = 1;
}

message S2CRoomUpdate {
  uint32 room_id = 1;
  repeated RoomPlayer players = 2;
}

message C2SStart {
}

message S2CMatchStart {
  uint32 tick_hz = 1;
  uint32 input_delay_frames = 2;
  uint32 seed = 3;
}
