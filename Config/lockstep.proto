syntax = "proto3";
package lockstep;
option csharp_namespace = "Lockstep.Proto";

// ----- 封包 -----
enum MsgId {
  reserved 5, 7;
  reserved "C2S_Start", "S2C_StartReject";
  Unspecified = 0;     // 未指定
  C2S_Join = 1;        // 进房
  S2C_JoinAck = 2;     // 进房成功
  S2C_JoinReject = 3;  // 进房拒绝
  S2C_RoomUpdate = 4;  // 房间名单变化
  S2C_MatchStart = 6;  // 开战通知
}

message Packet {
  MsgId id = 1;
  bytes body = 2;
}

// ----- 房间（进程内一场，无 room_id / 房主）-----
enum JoinRejectReason {
  reserved 3;
  reserved "JoinRejectAlreadyInRoom";
  JoinRejectUnspecified = 0;   // 未指定
  JoinRejectFull = 1;          // 已满
  JoinRejectPlaying = 2;       // 已开战
}

message RoomPlayer {
  reserved 2;
  reserved "is_host";
  uint32 player_id = 1;
  string nick_name = 3;
}

message C2SJoin {
  reserved 1;
  reserved "room_id";
  string nick_name = 2;
}

message S2CJoinAck {
  reserved 1, 3;
  reserved "room_id", "is_host";
  uint32 player_id = 2;
  repeated RoomPlayer players = 4;
}

message S2CJoinReject {
  JoinRejectReason reason = 1;
}

message S2CRoomUpdate {
  reserved 1;
  reserved "room_id";
  repeated RoomPlayer players = 2;
}

message S2CMatchStart {
  uint32 tick_hz = 1;
  uint32 input_delay_frames = 2;
  uint32 seed = 3;
}
