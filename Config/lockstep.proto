syntax = "proto3";
package lockstep;
option csharp_namespace = "Lockstep.Proto";

// ----- 封包 -----
enum MsgId {
  Unspecified = 0;     // 未指定
  C2S_Join = 1;        // 进房
  S2C_JoinAck = 2;     // 进房成功
  S2C_JoinReject = 3;  // 进房拒绝
  S2C_RoomUpdate = 4;  // 房间名单变化
  C2S_Start = 5;       // 房主开战
  S2C_MatchStart = 6;  // 开战通知
  S2C_StartReject = 7; // 开战拒绝
}

message Packet {
  MsgId id = 1;
  bytes body = 2;
}

// ----- 房间 -----
enum JoinRejectReason {
  JoinRejectUnspecified = 0;   // 未指定
  JoinRejectFull = 1;          // 已满
  JoinRejectPlaying = 2;       // 已开战
  JoinRejectAlreadyInRoom = 3; // 已在房内
}

enum StartRejectReason {
  StartRejectUnspecified = 0;      // 未指定
  StartRejectNotInRoom = 1;        // 不在房内
  StartRejectNotHost = 2;          // 不是房主
  StartRejectPlaying = 3;          // 已开战
  StartRejectNotEnoughPlayers = 4; // 人数不足
}

message RoomPlayer {
  uint32 player_id = 1;
  bool is_host = 2;
  string nick_name = 3;
}

message C2SJoin {
  uint32 room_id = 1;
  string nick_name = 2;
}

message S2CJoinAck {
  uint32 room_id = 1;
  uint32 player_id = 2;
  bool is_host = 3;
  repeated RoomPlayer players = 4;
}

message S2CJoinReject {
  JoinRejectReason reason = 1;
}

message S2CRoomUpdate {
  uint32 room_id = 1;
  repeated RoomPlayer players = 2;
}

message C2SStart {
}

message S2CStartReject {
  StartRejectReason reason = 1;
}

message S2CMatchStart {
  uint32 tick_hz = 1;
  uint32 input_delay_frames = 2;
  uint32 seed = 3;
}
